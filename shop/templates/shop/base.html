<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coffee Shop{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }
        header {
            background-color: #5D4037;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        nav h1 {
            font-size: 1.8rem;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #BCAAA4;
        }
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }
        .content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            background-color: #3E2723;
            color: white;
            text-align: center;
            padding: 1rem 0;
            margin-top: 3rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <h1>☕ Coffee Shop</h1>
            <ul>
                <li><a href="{% url 'shop:home' %}">Home</a></li>
                <li><a href="{% url 'shop:menu' %}">Menu</a></li>
                <li><a href="{% url 'shop:coffee_list' %}">Browse Coffees</a></li>
                <li><a href="{% url 'admin:index' %}">Admin</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>
    
    <footer>
        <p>&copy; 2024 Coffee Shop - Django Practice Project</p>
    </footer>
    
    {% block extra_js %}{% endblock %}
</body>
</html>

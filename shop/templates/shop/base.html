<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coffee Shop{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        header {
            background: #4a2c2a;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background: #6f4e37;
            padding: 1rem;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #f0e68c;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        h1, h2, h3 {
            color: #4a2c2a;
            margin-bottom: 1rem;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 1rem;
            border-radius: 8px;
            background: #fff;
        }
        .product-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .price {
            color: #6f4e37;
            font-weight: bold;
            font-size: 1.3rem;
            margin: 0.5rem 0;
        }
        footer {
            background: #4a2c2a;
            color: #fff;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #6f4e37;
            color: white;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: bold;
        }
        .badge-success { background-color: #28a745; color: white; }
        .badge-warning { background-color: #ffc107; color: black; }
        .badge-danger { background-color: #dc3545; color: white; }
        .badge-info { background-color: #17a2b8; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>☕ International Coffee Shop</h1>
        <p>Locally Produced from International Markets</p>
    </header>
    
    <nav>
        <ul>
            <li><a href="{% url 'shop:home' %}">Home</a></li>
            <li><a href="{% url 'shop:menu' %}">Menu</a></li>
            <li><a href="{% url 'shop:product_list' %}">Products</a></li>
            <li><a href="{% url 'shop:order_list' %}">Orders</a></li>
            <li><a href="{% url 'shop:inventory_status' %}">Inventory</a></li>
            <li><a href="{% url 'international_market:dashboard' %}">International Market</a></li>
            <li><a href="{% url 'admin:index' %}">Admin</a></li>
        </ul>
    </nav>
    
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    
    <footer>
        <p>&copy; 2025 International Coffee Shop - Connecting Local Production with Global Markets</p>
    </footer>
</body>
</html>
